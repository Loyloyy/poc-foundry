# Allowlisting CONNECT proxy — the SOLE egress for a per-build internal network (design §5.2).
# Default-deny: only the hosts below (build deps) + the single env-injected vLLM exception get out.
# This is a detective + preventive control, defense-in-depth — never "unescapable".

http_port 3128

# Run the worker as root so it can write the CONNECT log to the container's stdout. Debian's squid
# defaults to cache_effective_user=proxy, which then can't reopen /dev/stdout (owned by root, fd 1)
# → "FATAL: Cannot open '/dev/stdout'". Acceptable here: this is an EPHEMERAL, single-purpose,
# per-build egress gateway on an isolated network — the security boundary is Kata + the internal:true
# network, not this proxy's uid. Defense-in-depth only (design §5.2).
cache_effective_user root
# Set explicitly so squid never FATALs/hangs trying to resolve the container's own FQDN.
visible_hostname poc-foundry-proxy

# --- Ports ---
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# --- Public allowlist (build substrate: code forges, package index, model hub, container registries).
#     dstdomain leading-dot = host + ALL subdomains. Keep ONLY the broadest form per domain: squid 5+
#     treats a wildcard that OVERLAPS a more-specific sibling (e.g. `.docker.io` + `registry-1.docker.io`)
#     as a FATAL config error that aborts startup — not a warning. These wildcards already cover
#     pipeline.yaml's specific hosts (api/codeload/raw/objects.github*, files.pythonhosted.org,
#     registry-1/auth/index.docker.io, production.cloudflare.docker.com). ---
acl allowed_dst dstdomain .github.com
acl allowed_dst dstdomain .githubusercontent.com
acl allowed_dst dstdomain .pypi.org
acl allowed_dst dstdomain .pythonhosted.org
acl allowed_dst dstdomain .huggingface.co
acl allowed_dst dstdomain .docker.io
acl allowed_dst dstdomain .docker.com

# --- Access rules (ordered; first match wins) ---
# The single private-host exception (the vLLM endpoint) is evaluated FIRST so its non-standard port
# (e.g. 8000) isn't caught by the Safe_ports deny below. Generated at startup by entrypoint.sh from
# PF_VLLM_ALLOW_HOST so the real host/IP never lands in a tracked file (empty + a comment when unset).
include /etc/squid/vllm.conf

http_access deny !Safe_ports
http_access allow CONNECT SSL_ports allowed_dst
http_access allow allowed_dst

# Everything else is denied (and logged).
http_access deny all

# --- Logging: CONNECT evidence to stdout; the broker tees it to builds/<id>/logs/ (security record).
logformat connectlog %ts.%03tu %>a action=%Ss/%03>Hs method=%rm uri=%ru bytes=%<st
access_log stdio:/dev/stdout connectlog

# No on-disk caching (this is a policy gateway, not a cache).
cache deny all
# Foreground (-N) container: no PID file → avoids "Squid is already running" on any re-exec.
pid_filename none
# Quieter shutdown for ephemeral per-build lifecycles.
shutdown_lifetime 1 seconds
